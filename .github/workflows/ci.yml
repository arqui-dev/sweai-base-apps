name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege, declared explicitly. The default for a repository can be
# write-all, and this pipeline only ever needs to read the code (OWASP A03).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Placeholders only. The build must never need real credentials, and a
      # real key in CI is a key in the logs.
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
      SUPABASE_SECRET_KEY: sb_secret_placeholder
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      COFFEE_UNIT_AMOUNT: "500"
      COFFEE_CURRENCY: usd
      NEXT_PUBLIC_SANITY_PROJECT_ID: placeholder
      NEXT_PUBLIC_SANITY_DATASET: production
      RESEND_API_KEY: re_placeholder
      RESEND_FROM: Hire Service <hello@example.com>
      ADMIN_API_TOKEN: placeholder-admin-token-32-chars
      NEWSLETTER_SECRET: placeholder-newsletter-secret-32-chars

    steps:
      # Third-party actions are pinned by commit SHA. A tag is mutable and can
      # be repointed after review (OWASP A03).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # npm ci, never npm install: it fails when the lockfile and manifest
      # disagree instead of silently resolving something new.
      - run: npm ci

      # The storybook vitest project runs every story in Chromium, so the
      # browser has to exist before `npm run test`.
      - name: Install Chromium for the story tests
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run storybook:build

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Zero tolerance on anything that can run in a request. `info` is the
      # lowest threshold npm accepts, so any advisory at all fails the build.
      - name: Audit runtime dependencies (zero tolerance)
        run: npm audit --omit=dev --audit-level=info

      # Reported, not gated. Build and editor tooling cannot be reached by a
      # request, and the Sanity CLI kept for `sanity deploy` carries findings
      # whose only npm-offered fix is a major downgrade. Driving this to zero
      # is tracked in docs/ai-roadmap.md.
      - name: Report build-time dependencies (non-blocking)
        continue-on-error: true
        run: npm audit

      # Fails when package.json and the lockfile disagree, which is how an
      # unreviewed dependency slips in.
      - name: Lockfile matches the manifest
        run: npm ci --ignore-scripts --dry-run

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The gitleaks CLI, not gitleaks-action: the action requires a paid
      # license for GitHub organizations, and the binary it wraps is MIT.
      # Version pinned and checksum verified, because an unverified download
      # in the job that hunts supply chain holes is itself one.
      - name: Scan history for leaked credentials
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore \
            --redact --no-banner --exit-code 1
